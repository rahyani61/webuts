<!DOCTYPE html>
<html>
<head>
  <title>Tambah Kursus</title>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>EduTalent - Platform E-Learning</header>

  <div class="container">

    <aside>
      <ul class="menu">
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="tabel.html">Data Kursus</a></li>
        <li><a href="form.html">Tambah Kursus</a></li>
        <li><a href="login.html">Keluar</a></li>
      </ul>
    </aside>

    <section class="main">
      <h2 class="judul">Tambah Kursus</h2>

      <form>
        <div class="form-group">
          <label>Nama Kursus</label>
          <div class="input"><input type="text"></div>
        </div>
        <div class="form-group">
          <label>Kategori</label>
          <div class="input">
            <select>
              <option>Pemrograman</option>
              <option>Database</option>
              <option>Desain</option>
              <option>Produktivitas</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label>Instruktur</label>
          <div class="input"><input type="text"></div>
        </div>
        <div class="form-group">
          <label>Durasi</label>
          <div class="input"><input type="text"></div>
        </div>
        <div class="form-group">
          <label>Jenis Kursus</label>
          <input type="radio" name="jenis" value="online"> Online
          <input type="radio" name="jenis" value="offline"> Offline
        </div>
        <div class="form-group">
          <input type="submit" value="Simpan" class="tombol simpan">
          <input type="reset" value="Batal" class="tombol reset">
        </div>
      </form>

    </section>

  </div>

  <footer>Copyright &copy; 2024 EduTalent</footer>

</body>
</html>
